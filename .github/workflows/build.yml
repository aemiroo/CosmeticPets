name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 -m unittest discover -s resource-pack -p 'test_*.py'
      - run: python3 resource-pack/build_pack.py
      - run: python3 resource-pack/build_bedrock.py
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: CosmeticPets
          path: |
            target/CosmeticPets-*.jar
            target/CosmeticPets-Ghost-Pack.zip
            target/ghost-pack.sha1
            target/CosmeticPets-Bedrock.mcpack
            target/cosmeticpets-geyser-mappings.json
            target/cosmeticpets-display-mappings.yml
          if-no-files-found: error
      - name: Publish original ghost pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ghost-pack >/dev/null 2>&1; then
            gh release create ghost-pack --target "$GITHUB_SHA" --title "Original CosmeticPets Ghost Pack" --notes "Optional original Java 26.3 ghost model and textures. MIT licensed. Accept the pack to view ghost companions." --latest=false
          fi
          gh release upload ghost-pack target/CosmeticPets-Ghost-Pack.zip target/ghost-pack.sha1 target/CosmeticPets-Bedrock.mcpack target/cosmeticpets-geyser-mappings.json target/cosmeticpets-display-mappings.yml --clobber
