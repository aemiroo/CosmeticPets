name: CosmeticPets
version: 1.4.1
main: io.github.aemiroo.cosmeticpets.CosmeticPets
api-version: '1.21'
depend: [packetevents]
softdepend: [floodgate, Geyser-Spigot]
description: Free cosmetic companions with Christmas pets.
commands:
  pets:
    description: Choose, summon or dismiss your cosmetic pet
    usage: /pets [snowman|reindeer|summon|dismiss]
    permission: cosmeticpets.use
permissions:
  cosmeticpets.use:
    description: Use the free cosmetic pets menu
    default: true

  cosmeticpets.yeti.preview:
    description: Preview the Baby Yeti before its boss unlock is available
    default: op
