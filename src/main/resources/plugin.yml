name: CosmeticPets
version: 1.2.5
main: io.github.aemiroo.cosmeticpets.CosmeticPets
api-version: '1.21'
depend: [packetevents]
softdepend: [floodgate, Geyser-Spigot]
description: Free cosmetic Halloween companions.
commands:
  pets:
    description: Choose, summon or dismiss your cosmetic pet
    usage: /pets [cat|bat|zombie|ghost|pumpkin|summon|dismiss]
    permission: cosmeticpets.use
permissions:
  cosmeticpets.use:
    description: Use the free cosmetic pets menu
    default: true
